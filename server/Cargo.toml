[package]
name = "harmon-server"
version = "0.1.0"
edition = "2024"
license = "0BSD or UNLICENSED"

[dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors"] }
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.8"
log = "0.4.32"
clap = { version = "4.6.6", features = ["derive"] }
simple_logger = "5.2.0"
hex = "0.4.3"
base32 = "0.5.1"
mime_guess = "2.0.5"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "sqlite",
    "uuid",
    "time",
] }
time = { version = "0.3.51", features = ["serde", "parsing"] }
urlencoding = "2.1.3"
rand = { version = "0.10.1", features = ["sys_rng"] }
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
sha2 = "0.11.0"
jsonwebtoken = "9.3.1"
wspc = { version = "0.4.1", features = ["uuid_v7"] }
pkarr = "6.0.1"

[profile.release]
opt-level = "z"
strip = true
lto = true
